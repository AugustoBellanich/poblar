# PRAIS 2026 — OE2 — censo 2022
# Reproduce la ejecución final del 22/09/2026 (la que alimenta tablas y plataforma).
# Cada criterio indica de dónde sale. Ver aplicaciones/prais2026/README.md.

nombre: prais2026_2022
anio_censo: 2022

insumos:                      # rutas relativas a la carpeta de insumos (parámetro insumos=)
  tabla_censo:
    ruta: tabla_censo2022.xlsx  # export Redatam (C0), 15/05/2026; 7.067.340 bytes (versión de C1)
    sha256: 89000c8e18fb6b40a0363acefbc04e6c7fbeca3bcf2ca4a12daba3d4d4b13bef  # registrado el 27/10/2026
  radios:
    ruta: radios_2022.zip       # CONICET RI 11336/149711, RADIOS_2022_V2025-1
    sha256: 5bbd7d02fc247e1d2e6c5dbe849db6f2650c316cc3900dcbee2f8f14e68e5460
  mapbiomas:
    ruta: MB_prais_2023_100m.tif  # MapBiomas Argentina PRAIS26 (OE1), cobertura 2023, 100 m, EPSG:4326
    sha256: null
  degradacion:
    ruta: degradacion_reporte_2022.tif  # copia de CondicionFinal_Estado_Reporte2_4326.tif (OE1, OE 1.4, período de reporte 2, EPSG:4326)
    sha256: null
  regiones:
    ruta: regiones_PRAIS.gpkg
    sha256: eeb8ddcda7a96a904928836f6323950bf9d00ee5b3ae1074dddbc22215d74c66

radios:
  campo_codigo_mapa: COD_2022   # código de radio en la cartografía CONICET
  union: inner                # C1 de junio: solo radios con tabla y mapa (el 25/10 se probó 'left')
  id_desde: tabla
  orden: area_desc            # C2 2.5: área descendente (sin desempate, como el original)
  exportar_gpkg: false

region:
  campo: Reg_PRAIS
  umbral_vecino_km: 50       # C2 1.4, UMBRAL_DISTANCIA = 50000
  etiqueta_fuera: "Fuera de Región (Antártida/Islas)"
  excluir_fuera: false        # PRAIS 2026 los mantuvo; propuesto: true

grilla_trabajo:
  crs: 5347                   # POSGAR 2007 / Argentina 4 (C2 1.1)
  modo: gdal_auto             # C2 3.1: gdalwarp sin -tr; GDAL estima la resolución (propuesto: fija, 80 m)
  extension: radios           # C2 3.1: límites de los radios curados (propuesto: regiones)
  remuestreo_cobertura: near  # C2 3.1

cobertura:
  insumo: mapbiomas
  codigo_nodata: 0            # C2 3.4: 0 es no habitable y también NoData
  clases:                     # mapeo_clases del 22/09/2026 (C2 3.3)
    - {clase: 0,  descripcion: "NO DATA / FUERA DEL AREA",               meta: no_habitable}
    - {clase: 1,  descripcion: "Bosques",                                 meta: no_urbano}
    - {clase: 2,  descripcion: "Silvicultura",                            meta: no_urbano}
    - {clase: 3,  descripcion: "Arbustales",                              meta: no_urbano}
    - {clase: 4,  descripcion: "Mosaicos de arbustos y herbáceas",        meta: no_urbano}
    - {clase: 5,  descripcion: "Herbáceas",                               meta: no_urbano}
    - {clase: 6,  descripcion: "Cultivos y pasturas",                     meta: no_urbano}
    - {clase: 7,  descripcion: "Humedales",                               meta: no_urbano}     # criterio acordado
    - {clase: 8,  descripcion: "Áreas Urbanas",                           meta: urbano}
    - {clase: 9,  descripcion: "Hielo en superficie y nieve permanente",  meta: no_habitable}
    - {clase: 10, descripcion: "Otras áreas no vegetadas",                meta: no_habitable}
    - {clase: 11, descripcion: "Ríos, lagunas, lagos y océano",           meta: no_habitable}
    - {clase: 12, descripcion: "No observado",                            meta: no_habitable}

dasimetria:
  campo_ambito: ambito        # tipo de radio del censo: Urbano, Mixto, Rural
  ambitos: [Urbano, Mixto, Rural]
  ponderadores:
    normalizar_por: Urbano    # C2 4.2: mediana del ámbito / mediana urbana
    peso_urbano: complemento  # C2 4.2: píxel urbano = 1 − r en radios mixtos y rurales
  producto_poblacion: poblacion_dasimetrica
  variables:                  # C2 7.1 y 7.8: población del píxel × (variable / población del radio)
    - {producto: nbi,                 numerador: nbi_total}
    - {producto: agua_red,            numerador: agua_red_total}
    - {producto: pobla_mujer,         numerador: pobla_mujer}
    - {producto: pobla_varon,         numerador: pobla_varon}
    - {producto: pobla_total_urbana,  numerador: pobla_total_urbana}
    - {producto: pobla_total_rural,   numerador: pobla_total_rural}
    - {producto: pobla_mujer_urbana,  numerador: pobla_mujer_urbana}
    - {producto: pobla_mujer_rural,   numerador: pobla_mujer_rural}
    - {producto: pobla_varon_urbano,  numerador: pobla_varon_urbano}
    - {producto: pobla_varon_rural,   numerador: pobla_varon_rural}
    - {producto: agua_red_mujer,      numerador: agua_red_mujer}
    - {producto: agua_red_varon,      numerador: agua_red_varon}
    - {producto: agua_red_urbana,     numerador: agua_red_urbana}
    - {producto: agua_red_rural,      numerador: agua_red_rural}
    - {producto: nbi_mujer,           numerador: nbi_mujer}
    - {producto: nbi_varon,           numerador: nbi_varon}
    - {producto: nbi_urbana,          numerador: nbi_urbana}
    - {producto: nbi_rural,           numerador: nbi_rural}

cruce:                        # C3: capa de tierras degradadas × población
  insumo: degradacion
  clases:                     # C3 celda 5 (codebook del mail del 07/09/2026)
    - {clase: 0, etiqueta: "Sin datos",    binario: null}
    - {clase: 1, etiqueta: "Degradada",    binario: degradada}
    - {clase: 2, etiqueta: "No degradada", binario: no_degradada}   # estable
    - {clase: 3, etiqueta: "No degradada", binario: no_degradada}   # mejora
    - {clase: 9, etiqueta: "No degradada", binario: no_degradada}   # estable
  grupo_expuesto: degradada
  ambito_reporte: {Urbano: Urbano, Mixto: Rural, Rural: Rural}      # C3 8.5: Mixto se informa como Rural
  variables: [poblacion_dasimetrica, nbi, agua_red, pobla_varon, pobla_mujer,
              nbi_varon, nbi_mujer, agua_red_varon, agua_red_mujer]  # las 9 del C3 celda 7
  derivadas:
    - {nombre: agua_sin_red, total: poblacion_dasimetrica, resta: agua_red}  # C3 celda 8
  rasters_por_grupo: []       # PRAIS 2026: los rasters en TD salieron del C4 (otra grilla); propuesto: [degradada]

rendimiento:
  filas_por_bloque: 512       # no cambia resultados

referencia:
  poblacion_integrada: 45618784   # pipeline.log de la ejecución final

controles:
  modo: detener               # detener | advertir
  tolerancia_personas: 0
  tolerancia_conservacion_pct: 0.001
  tolerancia_radio_personas: 0.5
  consistencia_bloqueante: true

resultados_esperados:         # no bloqueante: verifica la reproducción de la ejecución del 22/09/2026
  radios:
    total: 66421
  grilla:
    ancho: 21003                 # C5: grilla 5347 del C2 final
    alto: 47151
  poblacion_raster: 45618783.995  # suma de poblacion_dasimetrica_2022.tif reproducido el 26/10/2026
  cruce:                        # C3 2022 del 22/09 (indicadores_pct_2022.csv) = informe, Tabla 6
    poblacion_dasimetrica: 5665133
    nbi: 712654
