# PRAIS 2026 — OE2 — censo 2010
# Reproduce la ejecución final del 22/09/2026 (la que alimenta tablas y plataforma).
# Cada criterio indica de dónde sale. Ver aplicaciones/prais2026/README.md.

nombre: prais2026_2010
anio_censo: 2010

insumos:                      # rutas relativas a la carpeta de insumos (parámetro insumos=)
  tabla_censo:
    ruta: tabla_censo2010.xlsx  # export Redatam (C0), 15/05/2026
    sha256: null              # completar con el de la ejecución de referencia
  radios:
    ruta: radios_2010.zip       # CONICET RI 11336/149711, RADIOS_2010_V2025-1
    sha256: null
  regiones:
    ruta: regiones_PRAIS.gpkg
    sha256: null

radios:
  campo_codigo_mapa: COD_2010   # código de radio en la cartografía CONICET
  union: inner                # C1 de junio: solo radios con tabla y mapa (el 25/10 se probó 'left')
  id_desde: tabla
  orden: area_desc            # C2 2.5: área descendente (sin desempate, como el original)
  exportar_gpkg: false

region:
  campo: Reg_PRAIS
  umbral_vecino_km: 50       # C2 1.4, UMBRAL_DISTANCIA = 50000
  etiqueta_fuera: "Fuera de Región (Antártida/Islas)"
  excluir_fuera: false        # PRAIS 2026 los mantuvo; propuesto: true

grilla_trabajo:
  crs: 5347                   # POSGAR 2007 / Argentina 4 (C2 1.1)

referencia:
  poblacion_integrada: 40114872   # pipeline.log de la ejecución final

controles:
  modo: detener               # detener | advertir
  tolerancia_personas: 0
  consistencia_bloqueante: true

resultados_esperados:         # no bloqueante: verifica la reproducción de la ejecución del 22/09/2026
  radios:
    total: 52378
    por_region:
      Pampa: 33686
      Chaco: 10842
      "Altos Andes, Monte y Puna": 3255
      Patagonia: 3020
      "Selva Paranaense": 1573
      "Fuera de Región (Antártida/Islas)": 2
