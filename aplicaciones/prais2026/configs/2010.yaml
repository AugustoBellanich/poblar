# PRAIS 2026 — OE2 — censo 2010 (período de referencia)
# Configuración con la que se produjeron las cifras y las capas oficiales del OE2 del
# Informe Nacional PRAIS 2026. Referencia de cada clave: docs/configuracion.md.

nombre: prais2026_2010
anio_censo: 2010

insumos:                      # rutas relativas a la carpeta de insumos (parámetro insumos=)
  tabla_censo:                # población por radio: total, sexo, urbana/rural, NBI y agua de red (Redatam, INDEC)
    ruta: tabla_censo2010.xlsx
    sha256: b84fdac064ee7b8c2424539f2e3d0ee513742b3aab0fe6f90c3db12037fd932d
  radios:                     # cartografía de radios censales (CONICET, repositorio 11336/149711)
    ruta: radios_2010.zip
    sha256: 464e9b4c265a27f46a48e0c5914ef4e833c14e8977b8f0c9c1eaad672f374baa
  mapbiomas:                  # cobertura del suelo MapBiomas Argentina, colección PRAIS 2026, 2015, 100 m, EPSG:4326
    ruta: MB_prais_2015_100m.tif
    sha256: 35b861a146f98bf85de4c898f75a3ccd8086a8d8f16feed38aa858a3e5a87de1
  degradacion:                # «Degradación de la tierra para el período de referencia (2000-2015)», OE1, EPSG:4326
    ruta: degradacion_referencia_2010.tif
    sha256: 7824aa2a38efc4a6ba38b182fa2737d613e262c8167e399d9235274c9800e903
  regiones:                   # regiones PRAIS 2026
    ruta: regiones_PRAIS.gpkg
    sha256: eeb8ddcda7a96a904928836f6323950bf9d00ee5b3ae1074dddbc22215d74c66

radios:
  campo_codigo_mapa: COD_2010    # código de radio en la cartografía
  union: inner                # solo radios presentes en la tabla y en el mapa (los demás quedan registrados)
  id_desde: tabla
  orden: area_desc            # orden de rasterización: grandes primero, chicos al final
  exportar_gpkg: false

region:
  campo: Reg_PRAIS
  umbral_vecino_km: 50        # radio sin intersección: región más cercana si está a 50 km o menos
  etiqueta_fuera: "Fuera de Región (Antártida/Islas)"
  excluir_fuera: false        # se conservan (Antártida e islas del Atlántico Sur)

grilla_trabajo:
  crs: 5347                   # POSGAR 2007 / Argentina 4 (métrico)
  modo: gdal_auto             # resolución estimada por GDAL a partir de la cobertura (~80 m)
  extension: radios           # límites de los radios
  remuestreo_cobertura: near  # vecino más cercano (la cobertura es categórica)

cobertura:
  insumo: mapbiomas
  codigo_nodata: 0            # 0 es «sin dato / fuera del área» y se trata como no habitable
  clases:                     # clase MapBiomas → metacategoría (no_habitable | urbano | no_urbano)
    - {clase: 0,  descripcion: "NO DATA / FUERA DEL AREA",               meta: no_habitable}
    - {clase: 1,  descripcion: "Bosques",                                 meta: no_urbano}
    - {clase: 2,  descripcion: "Silvicultura",                            meta: no_urbano}
    - {clase: 3,  descripcion: "Arbustales",                              meta: no_urbano}
    - {clase: 4,  descripcion: "Mosaicos de arbustos y herbáceas",        meta: no_urbano}
    - {clase: 5,  descripcion: "Herbáceas",                               meta: no_urbano}
    - {clase: 6,  descripcion: "Cultivos y pasturas",                     meta: no_urbano}
    - {clase: 7,  descripcion: "Humedales",                               meta: no_urbano}
    - {clase: 8,  descripcion: "Áreas Urbanas",                           meta: urbano}
    - {clase: 9,  descripcion: "Hielo en superficie y nieve permanente",  meta: no_habitable}
    - {clase: 10, descripcion: "Otras áreas no vegetadas",                meta: no_habitable}
    - {clase: 11, descripcion: "Ríos, lagunas, lagos y océano",           meta: no_habitable}
    - {clase: 12, descripcion: "No observado",                            meta: no_habitable}

dasimetria:
  campo_ambito: ambito        # tipo de radio en la tabla censal: Urbano, Mixto, Rural
  ambitos: [Urbano, Mixto, Rural]
  ponderadores:
    normalizar_por: Urbano    # peso del píxel no urbano = mediana de densidad del ámbito / mediana urbana, por región
    peso_urbano: complemento  # peso del píxel urbano = 1 − peso no urbano
  producto_poblacion: poblacion_dasimetrica
  variables:                  # raster de cada variable = población del píxel × (variable / población del radio)
    - {producto: nbi,                 numerador: nbi_total}
    - {producto: agua_red,            numerador: agua_red_total}
    - {producto: pobla_mujer,         numerador: pobla_mujer}
    - {producto: pobla_varon,         numerador: pobla_varon}
    - {producto: pobla_total_urbana,  numerador: pobla_total_urbana}
    - {producto: pobla_total_rural,   numerador: pobla_total_rural}
    - {producto: pobla_mujer_urbana,  numerador: pobla_mujer_urbana}
    - {producto: pobla_mujer_rural,   numerador: pobla_mujer_rural}
    - {producto: pobla_varon_urbano,  numerador: pobla_varon_urbano}
    - {producto: pobla_varon_rural,   numerador: pobla_varon_rural}
    - {producto: agua_red_mujer,      numerador: agua_red_mujer}
    - {producto: agua_red_varon,      numerador: agua_red_varon}
    - {producto: agua_red_urbana,     numerador: agua_red_urbana}
    - {producto: agua_red_rural,      numerador: agua_red_rural}
    - {producto: nbi_mujer,           numerador: nbi_mujer}
    - {producto: nbi_varon,           numerador: nbi_varon}
    - {producto: nbi_urbana,          numerador: nbi_urbana}
    - {producto: nbi_rural,           numerador: nbi_rural}

cruce:                        # población × tierras degradadas
  insumo: degradacion
  banda: 1
  clases:
    - {clase: 0, etiqueta: "Sin datos",    binario: null}           # no entra en el binario
    - {clase: 1, etiqueta: "Degradada",    binario: degradada}
    - {clase: 2, etiqueta: "No degradada", binario: no_degradada}   # estable
    - {clase: 3, etiqueta: "No degradada", binario: no_degradada}   # mejora
    - {clase: 9, etiqueta: "No degradada", binario: no_degradada}   # estable
  grupo_expuesto: degradada
  ambito_reporte: {Urbano: Urbano, Mixto: Rural, Rural: Rural}      # los radios mixtos se informan como rurales
  variables: [poblacion_dasimetrica, nbi, agua_red, pobla_varon, pobla_mujer,
              nbi_varon, nbi_mujer, agua_red_varon, agua_red_mujer]
  derivadas:
    - {nombre: agua_sin_red, total: poblacion_dasimetrica, resta: agua_red}
  rasters_por_grupo: []       # rasters de cada variable en tierras degradadas: no se generan en esta aplicación

publicacion:                  # capas de entrega: grilla de la cobertura (EPSG:4326), remuestreo por suma
  grilla_referencia: mapbiomas
  remuestreo: sum
  bloque: 1024
  compresion: deflate
  tolerancia_masa_pct: 0.001  # diferencia de suma admitida (advertencia)
  plantilla_nombre: "{nombre}_100m_wgs84_{anio}.tif"
  productos:                  # producto → nombre de la capa en la plataforma del ONDTyD
    poblacion_dasimetrica: OE2-3.Pob_dasim
    pobla_mujer:           OE2-3.Pob_dasim_fem
    pobla_varon:           OE2-3.Pob_dasim_mas
    pobla_total_urbana:    OE2-3.Pob_dasim_urb
    pobla_total_rural:     OE2-3.Pob_dasim_rur
    nbi:                   OE2-1.Pob_dasim_nbi
    nbi_mujer:             OE2-1.Pob_dasim_nbi-fem
    nbi_varon:             OE2-1.Pob_dasim_nbi-mas
    nbi_urbana:            OE2-1.Pob_dasim_nbi-urb
    nbi_rural:             OE2-1.Pob_dasim_nbi-rur
    agua_red:              OE2-2.Pob_dasim_agua
    agua_red_mujer:        OE2-2.Pob_dasim_agua-fem
    agua_red_varon:        OE2-2.Pob_dasim_agua-mas
    agua_red_urbana:       OE2-2.Pob_dasim_agua-urb
    agua_red_rural:        OE2-2.Pob_dasim_agua-rur

tablas:                       # indicadores país y tierras degradadas (TD)
  variable_poblacion: poblacion
  urbano_rural:               # persona: urbano/rural del censo | radio: tipo de radio (cruce.ambito_reporte)
    pais: persona
    td: radio
  variables:                  # campos de la tabla censal (país) y productos del cruce (TD) por grupo
    poblacion:
      censo: {total: pobla_total, mujer: pobla_mujer, varon: pobla_varon, urbano: pobla_total_urbana, rural: pobla_total_rural}
      td:    {total: poblacion_dasimetrica, mujer: pobla_mujer, varon: pobla_varon, urbano: pobla_total_urbana, rural: pobla_total_rural}
    nbi:
      censo: {total: nbi_total, mujer: nbi_mujer, varon: nbi_varon, urbano: nbi_urbana, rural: nbi_rural}
      td:    {total: nbi, mujer: nbi_mujer, varon: nbi_varon, urbano: nbi_urbana, rural: nbi_rural}
    agua_red:
      censo: {total: agua_red_total, mujer: agua_red_mujer, varon: agua_red_varon, urbano: agua_red_urbana, rural: agua_red_rural}
      td:    {total: agua_red, mujer: agua_red_mujer, varon: agua_red_varon, urbano: agua_red_urbana, rural: agua_red_rural}
  salidas:                    # una tabla por indicador de la CNULD; la fórmula vale para todas sus filas
    - {nombre: OE2-1_nbi,                 variable: nbi,       por: grupos,   formula: incidencia}   # SO2-1
    - {nombre: OE2-1_nbi_regiones,        variable: nbi,       por: regiones, formula: incidencia, grupos: [total, urbano, rural]}
    - {nombre: OE2-2_agua,                variable: agua_red,  por: grupos,   formula: incidencia}   # SO2-2
    - {nombre: OE2-2_agua_regiones,       variable: agua_red,  por: regiones, formula: incidencia, grupos: [total, urbano, rural]}
    - {nombre: OE2-3_poblacion,           variable: poblacion, por: grupos,   formula: exposicion}   # SO2-3
    - {nombre: OE2-3_poblacion_regiones,  variable: poblacion, por: regiones, formula: exposicion, grupos: [total, mujer, varon]}

rendimiento:
  filas_por_bloque: 512       # no cambia resultados

referencia:
  poblacion_integrada: 40114872    # población de la tabla censal en radios con cartografía

controles:
  modo: detener               # detener | advertir
  tolerancia_personas: 0
  tolerancia_conservacion_pct: 0.001
  tolerancia_radio_personas: 0.5
  consistencia_bloqueante: true

resultados_esperados:         # cifras oficiales del PRAIS 2026 producidas con esta configuración (no bloqueante)
  radios:
    total: 52378
    por_region:
      Pampa: 33686
      Chaco: 10842
      "Altos Andes, Monte y Puna": 3255
      Patagonia: 3020
      "Selva Paranaense": 1573
      "Fuera de Región (Antártida/Islas)": 2
  grilla:
    ancho: 22958
    alto: 92392
  poblacion_raster: 40114871.996
  cruce:                      # población en tierras degradadas
    poblacion_dasimetrica: 3808137
  publicacion:                # población en la capa publicada (EPSG:4326)
    poblacion_dasimetrica: 40114695.258
