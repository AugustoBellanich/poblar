# PRAIS 2026 — OE2 — período de referencia (censo 2010)
# Datos fijos de la ejecución oficial: huella (sha256) de cada insumo y cifras publicadas.
# Uso: ejecutar("aplicaciones/prais2026/metodo.yaml", registro="aplicaciones/prais2026/periodos/2010.yaml",
#               insumos={"tabla_censo": ..., "radios": ..., ...})
# Si un insumo no coincide con su huella, la ejecución se detiene; si una cifra no se reproduce,
# queda una advertencia en controles.csv.

